<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kayıt Defteri</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0F1318">
<meta name="apple-mobile-web-app-title" content="Kayıt Defteri">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>window.KD_PWA = true; if("serviceWorker" in navigator) addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });</script>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1318;--surface:#171D24;--raised:#202832;--raised2:#28313C;--ink:#E7EAEE;--muted:#A0AAB5;--faint:#6D7782;--line:#2C3540;--line2:#3A4552;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.35);--warn:#FF8A73;--ok:#7FC796;--accent:#8C9CFF;
  --is:#5B7FFF;--arastirma:#E5B93C;--kisisel:#4CB782;--r:8px;--font:"Schibsted Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 80px}
.hidden{display:none!important}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--muted)} .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.small{padding:3px 9px;font-size:13px} .btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--muted)} .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=password],select,textarea{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-weight:800;font-size:24px;letter-spacing:-.02em}
.dateline{color:var(--muted);font-size:14px} .sp{flex:1}
.sync{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:2px 10px}
/* katmanlar: sayfa (en koyu) → kart (surface) → kart içi alan (raised) → girdi (raised2) */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px;box-shadow:var(--shadow);margin-bottom:14px}
.sec h3{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.task{background:var(--raised)!important;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.task.missed{background:color-mix(in srgb,var(--warn) 16%,var(--raised))!important}
.tl,.week,.month,.board .col{box-shadow:var(--shadow)}
.col{background:var(--surface)!important} .col h4{padding-bottom:8px;border-bottom:1px solid var(--line)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=password],select,textarea{background:var(--raised2)!important;border-color:var(--line2)!important}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px}
.grp h3{font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.grp textarea{width:100%}
.cl{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.cli{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:3px 6px;border-radius:5px;background:var(--surface)}
.cli input{margin-top:3px} .cli.done span{text-decoration:line-through;color:var(--muted)}
.task .cl{margin:6px 0 0} .task .cli{background:transparent;padding:1px 0}
.deps{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;background:var(--raised)}
.dep{display:flex!important;flex-direction:row!important;gap:8px;align-items:flex-start;color:var(--ink)!important;font-size:13.5px!important}
dialog{background:var(--raised);box-shadow:0 20px 60px rgba(0,0,0,.6);border-color:var(--line2)}
.dlg h2{padding-bottom:10px;border-bottom:1px solid var(--line)}
.foot{background:var(--raised);position:sticky;bottom:0}
.preview .pv{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
nav.tabs{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 4px}
.capture{box-shadow:var(--shadow)}
@media (max-width:700px){
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;border:0;display:flex;flex-direction:column}
  dialog[open]{display:flex} #dlgBody{display:flex;flex-direction:column;height:100%;min-height:0}
  .dlg{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .foot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  input,select,textarea{font-size:16px!important}   /* iPhone'un girişte ekranı büyütmesini önler */
}
/* capture */
.capture{background:var(--raised);border:1.5px solid var(--ink);border-radius:var(--r);display:flex;gap:8px;align-items:flex-end;padding:8px 8px 8px 12px}
.capture textarea{flex:1;border:0;background:transparent;resize:none;outline:none;min-height:22px;max-height:160px;font-size:14px;padding:3px 0}
.icon{display:inline-flex;align-items:center;gap:6px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative} .thumb img{width:62px;height:62px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:13px;line-height:20px;padding:0}
.preview{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.pv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.pv:first-of-type{border-top:0} .pv.nobook{outline:1.5px solid var(--warn);outline-offset:3px;border-radius:4px}
.pv .fields{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pv .fields input[type=text].t{flex:1;min-width:200px;font-weight:600}
.why{font-size:12.5px;color:var(--muted)} .why b{color:var(--warn)}
.transcript{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:10px}
.transcript pre{white-space:pre-wrap;font:13px/1.5 var(--font);margin:6px 0 0;max-height:220px;overflow:auto}
.tagchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;background:var(--raised)}
.tagchip.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 12%,var(--raised))}
/* nav */
nav.tabs{display:flex;gap:2px;margin:16px 0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.cals{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:13px}
.cals label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;cursor:pointer;color:var(--muted)}
.cals label.on{color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.cals i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.cals input{display:none}
/* day */
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dayhead .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.alldays{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chip{font-size:12.5px;font-weight:600;border-radius:4px;padding:2px 8px;color:#12161B;background:var(--c);border:0;text-align:left}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.tl{position:relative;border-left:1px solid var(--line);margin-left:44px;background:var(--surface);border-radius:0 var(--r) var(--r) 0}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
.hr span{position:absolute;left:-44px;top:-8px;width:38px;text-align:right}
.ev{position:absolute;border-radius:5px;padding:3px 6px;overflow:hidden;font-size:12.5px;line-height:1.25;border:0;text-align:left;color:var(--ink);
  background:color-mix(in srgb,var(--c) 28%,var(--surface));border-left:3px solid var(--c)}
.ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev.past{opacity:.6}
.now{position:absolute;left:-5px;right:0;border-top:2px solid var(--warn);z-index:3}
.off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);opacity:.35}
.sec{margin-bottom:18px} .sec h3{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:600}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;margin-bottom:6px;background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.task.missed{border-color:color-mix(in srgb,var(--warn) 60%,var(--line));background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-left-color:var(--warn)}
.task .b{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;color:inherit}
.task .t{font-weight:600;overflow-wrap:anywhere} .task.closed .t{text-decoration:line-through;color:var(--muted)} .task.cancelled .t{text-decoration-color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:12.5px;color:var(--muted);margin-top:2px}
.meta span+span::before{content:"·";margin-right:8px;color:var(--faint)}
.late{color:var(--warn);font-weight:600}
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:50%;margin:2px 0 0;flex:none}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.x{background:none;border:1px solid var(--line);border-radius:5px;color:var(--muted);font-size:12px;padding:1px 7px}
/* week */
.week{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.wk-h{padding:6px 4px;font-size:12px;font-weight:600;text-align:center;border-bottom:1px solid var(--line);background:var(--raised);border:0;color:var(--ink)}
.wk-h.sat{color:#B99BE6} .wk-h.sun{color:#E58DA6} .wk-h.today{background:color-mix(in srgb,var(--accent) 22%,var(--raised))}
.wk-ad{min-height:24px;padding:2px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.wk-col{position:relative;border-left:1px solid var(--line)}
.wk-col.sat{background:color-mix(in srgb,#CDB1F2 6%,transparent)} .wk-col.sun{background:color-mix(in srgb,#F2A9BD 7%,transparent)} .wk-col.hol{background:color-mix(in srgb,#E57373 10%,transparent)}
.wk-gut{position:relative}
.wk-gut span{position:absolute;right:4px;font-size:10.5px;color:var(--faint);transform:translateY(-6px)}
.wk-line{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
@media (max-width:700px){.week{grid-template-columns:30px repeat(7,minmax(0,1fr))}.ev small{display:none}.ev{font-size:10.5px;padding:2px 3px}}
/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mh{background:var(--raised);font-size:12px;font-weight:600;color:var(--muted);padding:6px}
.mh.sat{color:#B99BE6} .mh.sun{color:#E58DA6}
.mc{background:var(--surface);min-height:104px;padding:4px 5px;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;color:inherit;min-width:0}
.mc.out{opacity:.4} .mc.sat{background:color-mix(in srgb,#CDB1F2 9%,var(--surface))} .mc.sun{background:color-mix(in srgb,#F2A9BD 10%,var(--surface))}
.mc.hol{background:color-mix(in srgb,#E57373 16%,var(--surface))} .mc.today .dn{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 6px;align-self:flex-start}
.mc.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.dn{font-size:12px;font-weight:600;color:var(--muted)}
.me{font-size:11px;line-height:1.25;border-radius:3px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 20%,transparent);border-left:2px solid var(--c)}
.me.ad{background:var(--c);color:#12161B;font-weight:600;border:0}
.more{font-size:11px;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap} .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
@media (max-width:700px){.mc{min-height:56px}.me,.more{display:none}.dots{display:flex}}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:200px}
.col h4{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between}
@media (max-width:700px){.board{grid-template-columns:1fr}}
/* dialog */
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--raised);color:var(--ink);padding:0;width:min(620px,95vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:16px 18px} .dlg h2{margin:0 0 12px;font-size:18px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px} .fg .full{grid-column:1/-1}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.fg label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
@media (max-width:560px){.fg{grid-template-columns:1fr}}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.days{display:flex;gap:4px;flex-wrap:wrap} .days label{flex-direction:row!important;align-items:center;gap:3px!important;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--ink)!important}
.scope{display:flex;flex-direction:column;gap:8px;margin-top:6px}
/* banners, toasts */
.banner{border:2px solid #F3C08F;background:color-mix(in srgb,#F3C08F 14%,var(--surface));border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.banner.ek{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}} .banner.blink .dot{animation:blink 1s steps(2,start) infinite}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#F3C08F;margin-right:8px}
@media (prefers-reduced-motion:reduce){.banner.blink .dot{animation:none}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;width:min(460px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r);font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:4px;padding:2px 8px;font-size:13px;margin-left:auto}
.toast.err{background:var(--warn);color:#1a0d0a}
table.list{border-collapse:collapse;width:100%;font-size:13.5px} table.list td,table.list th{padding:6px 8px;border-bottom:1px dotted var(--line);text-align:left;vertical-align:top} table.list th{color:var(--muted);font-weight:600}
.warnbox{margin-top:8px;border:1px solid var(--warn);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.warnbox.hi{border-width:2px;background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.warnbox ul{margin:4px 0 4px;padding-left:18px;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:14px;font-size:14px}
.loading{color:var(--muted);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Kayıt Defteri</div>
    <div class="dateline" id="dateline"></div>
    <div class="sp"></div>
    <span class="sync" id="sync">bağlanıyor…</span>
    <button class="btn small" id="btnSettings">Ayarlar</button>
  </header>

  <div class="capture">
    <textarea id="cap" rows="1" placeholder="Yeni veri ekle"></textarea>
    <select id="capBook" title="Hangi deftere?" style="flex:none;max-width:118px"><option value="">Otomatik</option><option value="is">İş</option><option value="arastirma">Araştırma</option><option value="kisisel">Kişisel</option></select>
    <button class="btn icon" id="btnPhoto" title="Galeriden ya da kameradan not fotoğrafı ekle" aria-label="Fotoğraf ekle">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg></button>
    <input type="file" id="photoInput" accept="image/*" multiple class="hidden">
    <button class="btn primary" id="btnParse">İşle</button>
  </div>
  <div class="hint" style="margin:6px 2px 0">Hızlı yazım: <code>Başlık @yer 18:00 yarın #iş #bölüm</code> · satırda <code>#iş</code>, <code>#araştırma</code> ya da <code>#kişisel</code> varsa anında işlenir. <button class="linkbtn" data-act="quickHelp" style="background:none;border:0;color:var(--accent);padding:0;font-size:12.5px">Kuralların tamamı</button></div>
  <div class="thumbs hidden" id="thumbs"></div>
  <div id="preview" class="preview hidden"></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="cals" id="cals"></div>
  <main id="view"><div class="loading">Veriler yükleniyor…</div></main>
</div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toasts" aria-live="polite"></div>

<script type="application/json" id="bootdata">null</script>
<script>
"use strict";
/* ============================ yardımcılar ============================ */
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d]=s.slice(0,10).split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return dstr(d); };
const todayStr = () => dstr(new Date());
const hm = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
const mhm = m => `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const GUN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"], GUNK=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const longDate = s => { const d=parseD(s); return `${d.getDate()} ${AY[d.getMonth()]} ${GUN[d.getDay()]}`; };
const weekStart = s => addDays(s, -((parseD(s).getDay()+6)%7));
const localMin = iso => { const d=new Date(iso); return d.getHours()*60+d.getMinutes(); };
const localDay = iso => iso.length<=10 ? iso : dstr(new Date(iso));

const STATUS = {inbox:"Gelen",todo:"Yapılacak",doing:"Sürüyor",waiting:"Bekliyor",done:"Bitti",cancelled:"İptal edildi"};
const BOOKS = {is:"İş",arastirma:"Araştırma",kisisel:"Kişisel"}, BOOK_IDS=Object.keys(BOOKS);
const ERR = { network:"Bağlantı kurulamadı. Çevrimdışıyken yazdıkların cihazında saklanır ve bağlanınca eşitlenir; bu bölüm bağlantı gerektirir.", no_key:"Yapay zekâ anahtarı girilmemiş. Ayarlar → Yapay zekâ bölümünden ekle.", bad_key:"Yapay zekâ anahtarı geçersiz.", rate_limited:"Kullanım sınırına ulaşıldı; birazdan tekrar dene.",
  invalid_json:"Modelin yanıtı okunamadı.", empty:"Metinde iş bulunamadı.", ai_error:"Yapay zekâ servisi hata verdi.", conflict:"Bu kayıt başka bir yerde (örneğin telefonda) değiştirildi; güncel hali yüklendi.",
  busy:"Sistem meşgul, birkaç saniye sonra tekrar dene.", unauthorized:"Erişim anahtarı geçersiz. Bağlantı bilgilerini yeniden gir.", need_setup:"Bağlantı kurulumu gerekli.", bad_model:"Model adı bulunamadı. Ayarlar → Yapay zekâ bölümüne AI Studio'da görünen Flash-Lite model adını yaz.", ai_off_photo:"Bu defterde yapay zekâ kapalı olduğu için fotoğraf okunamaz.", not_setup:"Kurulum tamamlanmamış.", read_only:"Bu takvim salt okunur.", undo_expired:"Geri alma süresi doldu.", network:"Bağlantı kurulamadı." };

/* ---------- sunucu çağrısı ---------- */
function call(action, args, tries){
  tries = tries === undefined ? (navigator.onLine === false ? 0 : 1) : tries;
  return callOnce(action, args).then(r => { if(S.offline){ S.offline = false; renderChip(); setTimeout(flushOutbox, 300); } return r; }).catch(e => { if(e && e.code==="network" && tries > 0){ setSync("bağlantı yavaş · yeniden deneniyor…", true); return new Promise(r=>setTimeout(r,1500)).then(()=>call(action, args, tries-1)); } throw e; });
}
function callOnce(action, args){
  return new Promise((resolve, reject) => {
    const payload = JSON.stringify({action, args: args||{}});
    const done = s => { let r; try{ r = JSON.parse(s); }catch(e){ return reject({code:"network", message:String(e)}); } r.ok ? resolve(r.data) : reject(r); };
    if(window.KD_PWA && !(window.google && google.script && google.script.run)){
      const cfg = lsGet("kd3-pwa"); if(!cfg || !cfg.url || !cfg.token){ reject({code:"need_setup", message:"Bağlantı kurulumu gerekli"}); return; }
      if(navigator.onLine === false){ reject({code:"network", message:"Çevrimdışı"}); return; }
      const ac = typeof AbortController !== "undefined" ? new AbortController() : null, to = setTimeout(()=>{ try{ ac && ac.abort(); }catch(e){} }, 20000);
      fetch(cfg.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({k:cfg.token, r:payload}), redirect:"follow", signal: ac ? ac.signal : undefined})
        .then(r=>r.text()).then(s=>{ clearTimeout(to); done(s); }).catch(e=>{ clearTimeout(to); reject({code:"network", message:String(e && e.message || e)}); });
    }
    else if(window.google && google.script && google.script.run) google.script.run.withSuccessHandler(done).withFailureHandler(e=>reject({code:"network", message:String(e && e.message || e)})).api(payload);
    else if(window.KD_MOCK) Promise.resolve().then(()=>window.KD_MOCK(payload)).then(done, e=>reject({code:"network",message:String(e)}));
    else reject({code:"network", message:"Sunucu yok"});
  });
}
function errText(e){ const base = ERR[e && e.code] || (e && e.message) || "Bilinmeyen hata"; const detail = e && e.message && ERR[e.code] && ["ai_error","bad_key","bad_model","rate_limited","invalid_json"].includes(e.code) ? " · Ayrıntı: " + e.message : ""; return base + detail; }

const S = { boot:null, tasks:[], cals:[], events:{}, ranges:{}, view:"today", day:todayStr(), month:todayStr().slice(0,7), selDay:null,
  visible: lsGet("kd3-visible"), taskFilter:{q:"", book:"", tag:""}, cap:null, imgs:[], busy:false, lastSync:null, pending:0 };
function calColor(key){ const c = S.cals.find(x=>x.key===key); return c ? c.color : "#9AA4AE"; }
function calOf(key){ return S.cals.find(x=>x.key===key); }
function bookColor(b){ return calColor(b); }
function isVisible(key){ return !S.visible || S.visible[key] !== false; }
/* ============================ ÇEVRİMDIŞI KATMAN ============================
   - Son görüntü (görevler, takvim, ayarlar) cihazda saklanır; bağlantı yokken uygulama bununla açılır.
   - Çevrimdışıyken yazdıkların cihazdaki KUYRUĞA girer, ekranda ⏳ ile görünür ve bağlanınca kendiliğinden eşitlenir.
   - Ayrıştırma bağlantı gerektirir: hızlı yazım (#iş …) çevrimdışı da çalışır; olmayan metinler ayrıştırılmadan Gelen kutusuna konur
     ve sonradan “Ayrıştır” düğmesiyle işlenebilir.
   - Her kayıt istemcide üretilen bir kimlik taşır; yanıt kaybolup istek yeniden gönderilse bile aynı kayıt iki kez oluşmaz.
   - Eşitlenemeyen (örneğin başkası aynı görevi değiştirmiş) kayıt kaybolmaz: Gelen kutusuna “Senkronlanamadı” notu olarak konur. */
const OB_KEY = "kd3-outbox", SNAP_KEY = "kd3-snap";
function obLoad(){ const q = lsGet(OB_KEY); return Array.isArray(q) ? q : []; }
function obSave(q){ lsSet(OB_KEY, q); renderChip(); }
function isOffline(){ return !!S.offline || (typeof navigator !== "undefined" && navigator.onLine === false); }
function isNetErr(e){ return !!e && e.code === "network"; }
function newOid(){ return "o" + Date.now().toString(16) + Array.from({length:6}, ()=>Math.floor(Math.random()*16).toString(16)).join(""); }   // yalnızca a–f ve 0–9: hem görev hem Google Takvim kimliği olarak geçerli
function enqueue(kind, payload, presetOid){ const q = obLoad(), oid = presetOid || newOid(); const it = {oid, kind, payload: typeof payload === "function" ? payload(oid) : payload, t: new Date().toISOString()}; q.push(it); obSave(q); return it; }
function isTmp(id){ return String(id||"").startsWith("tmp_"); }
function tmpTaskObj(t, key){ const now = new Date().toISOString();
  return Object.assign({id:"tmp_"+key, book:"is", title:"", notes:"", status:"todo", priority:3, due:"", dueTime:"", estimate:30, spent:0, tags:[], dependsOn:[], waitingOn:"", trigger:"", followUp:"", recipient:"", channel:"", recur:"", eventId:"", createdAt:now, updatedAt:now, closedAt:"", source:"çevrimdışı", archived:"", version:0, _pending:1}, t, {id:"tmp_"+key}); }
function tmpEventObj(x, key){
  if(x.start) return {id:"tmp_"+key, calKey:x.calKey, title:x.title, notes:x.notes||"", location:x.location||"", allDay:!!x.allDay, start:x.start, end:x.end, recurrence:x.recurrence||null, reminders:null, tags:x.tags||[], etag:"", _pending:1};
  const ad = x.type === "allday", t0 = x.time || "09:00";
  return {id:"tmp_"+key, calKey:x.book, title:x.title, notes:x.notes||"", location:x.location||"", allDay:ad, start: ad ? x.date : toIso(x.date, t0), end: ad ? addDays(x.endDate||x.date, 1) : toIso(x.date, x.endTime || mhm(Math.min(1439, hm(t0) + (x.durationMin||60)))), recurrence:null, reminders:null, tags:x.tags||[], etag:"", _pending:1};
}
function putTmpEvent(ev){ S.events[ev.id + "|" + ev.calKey] = ev; }
/** Kuyruktaki her şeyi yerel görünüme yeniden uygular (taslak görevler, bekleyen durum değişiklikleri, taslak etkinlikler). */
function applyPending(){
  obLoad().forEach(it => { const p = it.payload;
    if(it.kind === "task"){ const t = p.task;
      if(t.id === it.oid) upsertTask(tmpTaskObj(t, it.oid));
      else { const cur = S.tasks.find(x=>x.id===t.id); if(cur) Object.assign(cur, t, {_pending:1}); } }
    else if(it.kind === "status"){ const cur = S.tasks.find(x=>x.id===p.id); if(cur) Object.assign(cur, {status:p.status, closedAt: ["done","cancelled"].includes(p.status) ? it.t : "", _pending:1}); }
    else if(it.kind === "commit"){ p.proposals.forEach((x,i) => { if(x.type === "task") upsertTask(tmpTaskObj({book:x.book, title:x.title, notes:x.notes||"", due:x.date||"", dueTime:x.time||"", tags:x.tags||[], estimate:x.durationMin||30, status:"todo", source:"çevrimdışı"}, it.oid+"_"+i)); else putTmpEvent(tmpEventObj(x, it.oid+"_"+i)); }); }
    else if(it.kind === "event") putTmpEvent(tmpEventObj(p.event, it.oid)); });
}
function patchQueuedTask(tmpId, fields){ const oid = String(tmpId).slice(4), q = obLoad(), it = q.find(x=>x.oid===oid && x.kind==="task"); if(!it) return false; Object.assign(it.payload.task, fields, {id:oid}); obSave(q); return true; }
function offlineEdit(t, fields){
  if(isTmp(t.id)){ patchQueuedTask(t.id, fields); Object.assign(t, fields); }
  else { enqueue("task", {task:Object.assign({id:t.id, book:t.book}, fields), version:t.version}); Object.assign(t, fields, {_pending:1}); }
}
function describeItem(it){
  const p = it.payload;
  if(it.kind === "task") return `${isTmp("tmp_"+it.oid) && p.task.id===it.oid ? "Yeni görev" : "Görev değişikliği"}: ${p.task.title || (S.tasks.find(x=>x.id===p.task.id)||{}).title || "(başlıksız)"}${p.task.due?" · "+p.task.due:""}${p.task.notes?"\n"+p.task.notes:""}`;
  if(it.kind === "status") return `Durum değişikliği: ${(S.tasks.find(x=>x.id===p.id)||{}).title || p.id} → ${STATUS[p.status]||p.status}`;
  if(it.kind === "commit") return "Hızlı yazım kayıtları:\n" + p.proposals.map(x=>`- ${x.type} · ${BOOKS[x.book]} · ${x.title}${x.date?" · "+x.date:""}${x.time?" "+x.time:""}`).join("\n");
  if(it.kind === "event") return `Yeni etkinlik: ${p.event.title} · ${String(p.event.start).slice(0,16).replace("T"," ")}`;
  return it.kind;
}
function bookOfItem(it){ const p = it.payload; return (p.task && p.task.book) || (p.event && (S.cals.find(c=>c.key===p.event.calKey)||{}).book) || (p.proposals && p.proposals[0] && p.proposals[0].book) || "is"; }

/* ---------- son görüntü ---------- */
let snapTimer = null;
function snapSoon(){ clearTimeout(snapTimer); snapTimer = setTimeout(snapSave, 1500); }
function snapSave(){
  try{ if(!S.boot) return; const lo = addDays(todayStr(), -14), hi = addDays(todayStr(), 75);
    const evs = Object.values(S.events).filter(e => !isTmp(e.id) && localDay(e.start) >= lo && localDay(e.start) <= hi);
    const snap = {savedAt:new Date().toISOString(), lo, hi, boot:{settings:S.boot.settings, ai:S.boot.ai, z:S.boot.z, user:S.boot.user, today:S.boot.today}, calendars:S.cals, tasks:S.tasks.filter(t=>!isTmp(t.id)), events:evs};
    let s = JSON.stringify(snap); if(s.length > 3.5e6){ snap.events = evs.slice(0, 400); }
    lsSet(SNAP_KEY, snap);
  }catch(e){}
}
function loadSnapshotInto(){
  const snap = lsGet(SNAP_KEY); if(!snap || !snap.boot || !Array.isArray(snap.tasks)) return false;
  S.boot = Object.assign({}, snap.boot, {tasks:snap.tasks, calendars:snap.calendars}); S.tasks = snap.tasks; S.cals = snap.calendars || []; S.snapAt = snap.savedAt;
  S.events = {}; (snap.events||[]).forEach(e => { S.events[e.id+"|"+e.calKey] = e; }); S.cover = [{from:snap.lo, to:snap.hi, at:0}];
  return true;
}

/* ---------- üst çubuktaki durum ---------- */
function renderChip(){
  const el = $("#sync"); if(!el) return; const n = obLoad().length; el.style.cursor = (n || isOffline()) ? "pointer" : "default";
  if(isOffline()){ el.textContent = `○ çevrimdışı${S.snapAt ? " · son veri "+pad(new Date(S.snapAt).getHours())+":"+pad(new Date(S.snapAt).getMinutes()) : ""}${n ? " · "+n+" bekliyor" : ""}`; el.style.color = "var(--warn)"; return; }
  if(S.flushing){ el.textContent = `↻ ${n} kayıt eşitleniyor…`; el.style.color = "var(--muted)"; return; }
  if(n){ el.textContent = `↻ ${n} kayıt bekliyor · dokun`; el.style.color = "var(--warn)"; return; }
  const c = S.chip || {txt:"● güncel", bad:false}; el.textContent = c.txt; el.style.color = c.bad ? "var(--warn)" : "var(--muted)";
}
function setOfflineFlag(){ S.offline = true; renderChip(); }
function removeQueuedTmp(tmpId){ const oid = String(tmpId).slice(4), q = obLoad().filter(x=>x.oid!==oid); obSave(q); S.tasks = S.tasks.filter(x=>x.id!==tmpId); }
function setSync(txt, bad){ S.chip = {txt, bad:!!bad}; renderChip(); }
function showOutbox(){

  $("#dlgBody").innerHTML = `<div class="dlg"><h2>Bekleyen kayıtlar</h2><p class="hint" style="margin:0 0 10px">${isOffline() ? "Şu an çevrimdışısın." : "Bağlantı var."} Bu kayıtlar cihazında saklanıyor; bağlanınca kendiliğinden eşitlenir, hiçbiri kaybolmaz.</p>
    ${q.length ? q.map(it=>`<div class="task" style="--c:var(--accent)"><div class="b"><div class="t" style="white-space:pre-wrap">${esc(describeItem(it).slice(0,220))}</div><div class="meta"><span>${esc(it.t.slice(0,16).replace("T"," "))}</span></div></div><button class="x" data-act="obDel" data-oid="${it.oid}">Sil</button></div>`).join("") : `<div class="empty">Bekleyen kayıt yok.</div>`}</div>
    <div class="foot"><span></span><div class="row"><button class="btn" data-act="dlgClose">Kapat</button><button class="btn primary" data-act="obFlush" ${q.length?"":"disabled"}>Şimdi eşitle</button></div></div>`;
  $("#dlg").showModal();
}

/* ---------- eşitleme ---------- */
async function runItem(it, ver){
  const p = it.payload;
  if(it.kind === "task"){
    const t = Object.assign({}, p.task), create = t.id === it.oid, want = t.status;
    if(create && (want === "done" || want === "cancelled")) t.status = "todo";
    const r = await call("task.save", {task:t, version: create ? undefined : (ver[t.id] !== undefined ? ver[t.id] : p.version)});
    ver[r.task.id] = r.task.version;
    if(create && (want === "done" || want === "cancelled")){ const s = await call("task.status", {id:r.task.id, status:want, version:r.task.version}); ver[r.task.id] = s.task.version; }
    if(p.cal && r.task.due){ const c = await call("task.calendar", {id:r.task.id, on:true}); ver[r.task.id] = c.task.version; }
  } else if(it.kind === "status"){
    const r = await call("task.status", {id:p.id, status:p.status, version: ver[p.id] !== undefined ? ver[p.id] : p.version}); ver[p.id] = r.task.version;
  } else if(it.kind === "commit"){
    await call("capture.commit", {parseId:null, proposals:p.proposals, corrections:[], archiveIds:[]});
  } else if(it.kind === "event"){
    await call("event.save", {event:p.event, scope:"single"});
  }
}
async function rescueItem(it, e){
  await call("task.save", {task:{id:"r"+it.oid, book:bookOfItem(it), title:"⚠ Senkronlanamadı: " + describeItem(it).split("\n")[0].slice(0,70), notes:describeItem(it) + "\n\nNeden: " + errText(e) + "\nÇevrimdışıyken kaydedilmişti; içeriği kontrol edip elle düzelt.", status:"inbox", source:"çevrimdışı"}});
}
async function flushOutbox(){
  if(S.flushing || isOffline()) return; const q = obLoad(); if(!q.length) return;
  S.flushing = true; renderChip();
  const ver = {}, rest = []; let done = 0, rescued = 0;
  for(let i = 0; i < q.length; i++){ const it = q[i];
    try{ await runItem(it, ver); done++; }
    catch(e){
      if(isNetErr(e)){ rest.push(...q.slice(i)); break; }
      try{ await rescueItem(it, e); rescued++; }
      catch(e2){ if(isNetErr(e2)){ rest.push(...q.slice(i)); break; } rescued++; }
    }
  }
  obSave(rest); S.flushing = false;
  if(rest.length && isNetErr({code:"network"}) && navigator.onLine === false){ S.offline = true; }
  if(done || rescued){
    try{ await refreshAll(); invalidateEvents(); Object.keys(S.events).forEach(k=>{ if(isTmp(k)) delete S.events[k]; }); applyPending(); await ensureRange(true); }catch(e){}
    render(); snapSoon();
    toast(`${done} çevrimdışı kayıt eşitlendi${rescued ? `, ${rescued} tanesi Gelen kutusuna not olarak kondu` : ""}${rest.length ? `; ${rest.length} kayıt hâlâ bekliyor` : ""}`, rescued ? {err:true} : {});
  }
  renderChip();
}
window.addEventListener("online", ()=>{ S.offline = false; renderChip(); flushOutbox(); });
window.addEventListener("offline", ()=>{ S.offline = true; renderChip(); });

/* ---------- çevrimdışı yazma yolları ---------- */
function queueRaw(text, book, ctxDay){
  const b = book || S.capBook || S.lastBook || "is", first = text.split("\n").map(s=>s.trim()).filter(Boolean)[0] || text;
  const it = enqueue("task", oid => ({task:Object.assign({id:oid, book:b, title:first.slice(0,90), notes:text, status:"inbox", source:"çevrimdışı"}, ctxDay ? {due:ctxDay} : {})}));
  if(ctxDay){ const dc = $("#dayCap"); if(dc) dc.value = ""; } else { capEl.value = ""; capEl.style.height = "auto"; }
  upsertTask(tmpTaskObj(it.payload.task, it.oid)); render();
  toast("Çevrimdışı: metin ayrıştırılmadan " + BOOKS[b] + " defterinin Gelen kutusuna kaydedildi (⏳). Bağlanınca eşitlenir; sonra “Ayrıştır” ile işleyebilirsin.");
}
function queueCommit(c, use){
  const it = enqueue("commit", oid => ({proposals: use.map((p,i)=>Object.assign({}, p, {cid: oid + i, orig: undefined}))}), c.cid);
  applyPending(); S.cap = null; renderPreview(); if(c.ctxDay === null){ capEl.value = ""; capEl.style.height = "auto"; } else { const dc = $("#dayCap"); if(dc) dc.value = ""; }
  S.imgs = []; renderThumbs(); render();
  toast(`Çevrimdışı: ${use.length} kayıt kuyruğa alındı (⏳). Bağlanınca eşitlenir.`);
}
function offlineSaveTask(t, data, wantCal, cid){
  if(!t.id){ const it = enqueue("task", oid => ({task:Object.assign({}, data, {id:oid, status:data.status || "todo"}), cal:wantCal}), cid); upsertTask(tmpTaskObj(it.payload.task, it.oid)); S.lastBook = data.book; }
  else offlineEdit(t, data);
  toast("Çevrimdışı: görev kaydedildi (⏳), bağlanınca eşitlenir.");
}
function offlineSaveEvent(form, cid){
  const it = enqueue("event", oid => ({event:Object.assign({}, form, {clientId:oid})}), cid);
  putTmpEvent(tmpEventObj(it.payload.event, it.oid)); toast("Çevrimdışı: etkinlik kuyruğa alındı (⏳). Bağlanınca takvime yazılır.");
}


/* ---------- etkinlik önbelleği: önce ekrandakini göster, arkada tazele ---------- */
S.cover = [];   // {from, to, at}: bu aralıkların verisi elimizde
function coveredBy(from, to){ return S.cover.find(c => c.from <= from && c.to >= to) || null; }
function mergeEvents(from, to, list){
  Object.keys(S.events).forEach(k=>{ const e=S.events[k]; const d=localDay(e.start); if(d>=from && d<=to) delete S.events[k]; });
  list.forEach(e=>{ S.events[e.id+"|"+e.calKey] = e; });
  S.cover = S.cover.filter(c => !(c.from >= from && c.to <= to)); S.cover.push({from, to, at: Date.now()});
}
const inflight = {};
async function loadEvents(from, to, force){
  if(isOffline()) return;
  const key = from+"|"+to; if(inflight[key]) return inflight[key];
  inflight[key] = (async ()=>{
    try{
      const r = await call("events.list", {from, to, force: !!force});
      mergeEvents(from, to, r.events);
      if(r.errors && r.errors.length) toast("Bazı takvimler okunamadı: " + r.errors.map(x=>x.cal).join(", "), {err:true});
      S.lastSync = new Date(); setSync("● güncel " + pad(S.lastSync.getHours())+":"+pad(S.lastSync.getMinutes()));
    }catch(e){ setSync("bağlantı hatası · yeniden denenecek", true); throw e; }
    finally{ delete inflight[key]; }
  })();
  return inflight[key];
}
function viewRange(){
  if(S.view==="today") { const m = S.day.slice(0,8)+"01"; return [addDays(m,-7), addDays(m,45)]; }   // günü değil ayı çek: gün gezinmesi anında olur
  if(S.view==="week"){ const f = weekStart(S.day); return [addDays(f,-7), addDays(f,13)]; }
  if(S.view==="month"){ const f = weekStart(S.month+"-01"); return [f, addDays(f,41)]; }
  return [todayStr(), addDays(todayStr(), 7)];
}
/** Görünüm için veri: elde varsa beklemeden döner (eskiyse arkada tazeler); yoksa yükler. Komşu ayları da arkada hazırlar. */
async function ensureRange(force){
  if(isOffline()) return;
  const [from, to] = viewRange(), c = coveredBy(from, to);
  if(c && !force){
    if(Date.now() - c.at > 120000) loadEvents(from, to).then(softRender).catch(()=>{});
  } else if(c && force){ loadEvents(from, to, true).then(softRender).catch(()=>{}); }
  else { try{ await loadEvents(from, to, force); }catch(e){} }
  prefetchAround();
}
function prefetchAround(){
  if(S.view!=="month" && S.view!=="today") return;
  const base = S.view==="month" ? S.month : S.day.slice(0,7);
  [-1, 1].forEach(dm=>{ const [y,m] = base.split("-").map(Number); const d = new Date(y, m-1+dm, 1); const mk = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const f = weekStart(mk+"-01"), t = addDays(f, 41); if(!coveredBy(f, t)) setTimeout(()=>loadEvents(f, t).catch(()=>{}), 400); });
}
/** Arka plandaki tazelemeden sonra yalnızca veriye bağlı görünümleri yeniden çizer (rapor ve geçmiş formlarına dokunmaz). */
function softRender(){ if(["today","week","month","tasks"].includes(S.view) && !$("#dlg").open) render(); }
function invalidateEvents(){ S.cover.forEach(c=>c.at = 0); }
function eventsOn(day){
  return Object.values(S.events).filter(e => isVisible(e.calKey) && (e.allDay ? (day >= e.start && day < e.end) : localDay(e.start) === day));
}
function upsertTask(t){ const i = S.tasks.findIndex(x=>x.id===t.id); if(i>=0) S.tasks[i] = t; else S.tasks.push(t); }
function upsertEvent(e, oldKey){ if(oldKey) delete S.events[oldKey]; S.events[e.id+"|"+e.calKey] = e; }
async function refreshTasks(){ const r = await call("tasks.list"); S.tasks = r.tasks; if(S.boot) S.boot.z = r.z; }
async function refreshAll(){ const b = await call("bootstrap"); S.boot = b; S.tasks = b.tasks; S.cals = b.calendars; }
function busyBtn(sel, on, label){ const b = typeof sel==="string" ? $(sel) : sel; if(!b) return; if(on){ b.dataset.l = b.textContent; b.disabled = true; b.textContent = label || "Kaydediliyor…"; } else { b.disabled = false; if(b.dataset.l) b.textContent = b.dataset.l; } }

/* ============================ açılış ============================ */
async function boot(){
  const d=new Date(); $("#dateline").textContent = `${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()}, ${GUN[d.getDay()]}`;
  let b = null; try{ b = JSON.parse($("#bootdata").textContent); }catch(e){ b = null; }   // sayfayla birlikte gelen veri: ek bekleme yok
  if(!b || b.error){
    let loaded = false;
    if(navigator.onLine === false && loadSnapshotInto()){ S.offline = true; loaded = true; }      // bağlantı yok: son görüntüyle aç
    if(!loaded){
      try{ await refreshAll(); }
      catch(e){ if(e && ["need_setup","unauthorized"].includes(e.code)){ showPwaSetup(e.code==="unauthorized" ? errText(e) : ""); return; }
        if(isNetErr(e) && loadSnapshotInto()){ S.offline = true; }
        else { $("#view").innerHTML = `<div class="empty">Sistem açılamadı: ${esc(errText(e))}${isNetErr(e)?`<br><span class="hint">İlk açılışta internet gerekir; veriler cihaza bir kez yüklenmeli. Sonrasında çevrimdışı da açılır.</span>`:""}<div class="row" style="margin-top:10px"><button class="btn primary" onclick="location.reload()">Yeniden dene</button></div></div>`; setSync("hata", true); return; } }
    }
  } else {
    S.boot = b; S.tasks = b.tasks; S.cals = b.calendars;
    if(b.initialEvents) mergeEvents(b.initialEvents.from, b.initialEvents.to, b.initialEvents.events);
    setSync("● güncel");
  }
  if(!S.visible){ S.visible = {}; }
  renderTabs(); renderCals();
  applyPending(); renderChip();
  await ensureRange(); render();
  if(!isOffline()) flushOutbox();
  if(S.boot.ai && !S.boot.ai.hasKey && !isOffline()) toast("Yapay zekâ anahtarı henüz girilmedi. Ayarlar'dan ekleyebilirsin; o zamana kadar girişler Gelen kutusuna düşer.");
  setInterval(()=>{ if(S.offline && navigator.onLine !== false) call("tasks.list", {}, 0).catch(()=>{}); }, 30000);      // “çevrimdışı” işaretliyken bağlantı geri geldi mi diye yoklar
  setInterval(async ()=>{ if(isOffline()) return; if(obLoad().length){ await flushOutbox(); } if($("#dlg").open || S.busy || document.activeElement?.tagName==="TEXTAREA") return; try{ await refreshTasks(); const [f,t]=viewRange(); await loadEvents(f,t,true); softRender(); }catch(e){} }, 120000);
  setInterval(()=>{ if(S.view==="today" && !$("#dlg").open) renderBannerOnly(); }, 60000);
}

/* ============================ sekmeler / takvim filtresi ============================ */
const TABS = [["today","Bugün"],["week","Hafta"],["month","Ay"],["tasks","Görevler"],["calls","Çağrılar"],["reports","Raporlar"],["history","Geçmiş"]];
function renderTabs(){ $("#tabs").innerHTML = TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.view===k}">${l}</button>`).join(""); }

}
$("#tabs").addEventListener("click", async e=>{ const b=e.target.closest("[data-tab]"); if(!b) return; S.view=b.dataset.tab; renderTabs(); const [f,t]=viewRange(); if(!coveredBy(f,t)) $("#view").innerHTML='<div class="loading">Yükleniyor…</div>'; else render(); await ensureRange(); render(); });

/* ============================ ortak parçalar ============================ */
function taskMissed(t){   // mesai saati yok: bir iş yalnızca günü geçince "kalan" sayılır
  if(["done","cancelled","waiting"].includes(t.status) || !t.due) return false;
  return t.due < todayStr();
}
function taskHTML(t){
  const closed = t.status==="done"||t.status==="cancelled";
  const bits = [];
  if(t.status==="cancelled") bits.push(`<span class="late">İptal edildi</span>`);
  else if(taskMissed(t)) bits.push(`<span class="late">önceki günden kaldı</span>`);
  if(t.due) bits.push(`<span>${t.due===todayStr()?"bugün":esc(longDate(t.due))}${t.dueTime?" "+t.dueTime:""}</span>`);
  if(t.status!=="todo" && t.status!=="cancelled") bits.push(`<span>${STATUS[t.status]}</span>`);
  if(t.waitingOn) bits.push(`<span>bekleniyor: ${esc(t.waitingOn)}</span>`);
  if(t.source==="e-posta") bits.push(`<span>✉ e-posta önerisi</span>`);
  if(isTmp(t.id) || t._pending) bits.push(`<span style="color:var(--warn)">⏳ beklemede</span>`);
  if(t.source==="çevrimdışı" && t.status==="inbox" && !isTmp(t.id)) bits.push(`<span>ayrıştırılmadı</span>`);
  const cl = parseChecklist(t.notes); if(cl.length) bits.push(`<span>☑ ${cl.filter(x=>x.done).length}/${cl.length}</span>`);
  if(t.estimate) bits.push(`<span>${t.estimate} dk</span>`);
  (t.tags||[]).forEach(g=>bits.push(`<span>#${esc(g)}</span>`));
  const deps = (t.dependsOn||[]).map(id=>S.tasks.find(x=>x.id===id)).filter(x=>x && !["done","cancelled"].includes(x.status));
  if(deps.length) bits.push(`<span class="late">önce: ${deps.map(d=>esc(d.title)).join(", ")}</span>`);
  return `<div class="task ${closed?"closed":""} ${t.status==="cancelled"?"cancelled":""} ${taskMissed(t)?"missed":""}" style="--c:${bookColor(t.book)}" data-task="${t.id}">
    <input type="checkbox" class="chk" data-act="done" aria-label="Tamamla" ${t.status==="done"?"checked":""} ${t.status==="cancelled"?"disabled":""}>
    <div style="flex:1;min-width:0"><button class="b" data-act="editTask"><div class="t">${esc(t.title)}</div><div class="meta"><span>${BOOKS[t.book]}</span>${bits.join("")}</div></button>${!closed && cl.length ? checklistHTML(t.notes, t.id) : ""}</div>
    ${closed ? (t.status==="cancelled"?`<button class="x" data-act="reopen">Geri al</button>`:"") : `${t.source==="çevrimdışı" && t.status==="inbox" && !isTmp(t.id) ? `<button class="x" data-act="reparse">Ayrıştır</button>` : ""}<button class="x" data-act="cancel">İptal</button>`}
  </div>`;
}
function visibleTasks(){ return S.tasks.filter(t => isVisible(t.book)); }
function layoutLanes(items){
  const bs = items.slice().sort((a,b)=>a.s-b.s || (b.e-b.s)-(a.e-a.s)); let cl=[], end=-1; const cls=[];
  bs.forEach(b=>{ if(b.s>=end && cl.length){ cls.push(cl); cl=[]; } cl.push(b); end=Math.max(end,b.e); }); if(cl.length) cls.push(cl);
  cls.forEach(c=>{ const lanes=[]; c.forEach(b=>{ let i=lanes.findIndex(x=>x<=b.s); if(i<0){ i=lanes.length; lanes.push(0);} lanes[i]=b.e; b.lane=i; }); c.forEach(b=>b.lanes=lanes.length); });
  return bs;
}
function timedBlocks(day){
  return eventsOn(day).filter(e=>!e.allDay).map(e=>{ const sd=localDay(e.start), ed=localDay(e.end);
    return { e, s: sd<day ? 0 : localMin(e.start), e2: ed>day ? 1440 : localMin(e.end) }; }).map(b=>({ev:b.e, s:b.s, e:Math.max(b.s+15, b.e2)}));
}
function evButton(b, top, h, extraStyle){
  const e=b.ev, past = localDay(e.end) < todayStr() || (localDay(e.end)===todayStr() && localMin(e.end) < nowMin() && !e.allDay);
  const w = 100/b.lanes, left = `calc(${b.lane*w}% + 2px)`, width = `calc(${w}% - 4px)`;
  return `<button class="ev ${past?"past":""}" style="--c:${calColor(e.calKey)};top:${top}px;height:${h}px;left:${left};width:${width};${extraStyle||""}" data-ev="${esc(e.id+"|"+e.calKey)}" title="${esc(e.title)}">
    <b>${esc(e.title)}</b>${h>30?`<small>${mhm(b.s)}–${mhm(b.e%1440===0&&b.e?1440:b.e)} · ${esc((calOf(e.calKey)||{}).name||"").replace(/^KD · /,"")}</small>`:""}</button>`;
}
function mapUrl(q){ const apple = /iPhone|iPad|Macintosh/.test(navigator.userAgent); return (apple ? "https://maps.apple.com/?q=" : "https://www.google.com/maps/search/?api=1&query=") + encodeURIComponent(q); }
function isHoliday(day){ return eventsOn(day).some(e=>e.calKey==="tatil"); }

/* ============================ BUGÜN ============================ */
function zBannerHTML(){
  const z = S.boot && S.boot.z, last = z && z.last;
  return `<div class="hint" style="margin:0 0 10px">Z raporu her gece 00:00'da e-postana gelir ve sistem yedeği alınır.${last?` Son rapor: ${esc(last.day)}.`:""} <button class="linkbtn" data-act="zSend" data-mode="elle" style="color:var(--accent);background:none;border:0;padding:0;font-size:12.5px">Şimdi ara rapor gönder</button></div>`;
}
function renderBannerOnly(){ const b=$("#zb"); if(b) b.innerHTML = zBannerHTML(); }
function renderToday(v){
  const day=S.day, isToday = day===todayStr();
  const allDay = eventsOn(day).filter(e=>e.allDay);
  const blocks = layoutLanes(timedBlocks(day));
  const ws = Math.min(8*60, ...blocks.map(b=>b.s)), we = Math.max(20*60, ...blocks.map(b=>b.e));
  const rs = Math.floor(ws/60)*60, re = Math.min(1440, Math.ceil(we/60)*60), PPM = 1.1, H=(re-rs)*PPM;
  let hrs=""; for(let m=rs;m<=re;m+=60) hrs+=`<div class="hr" style="top:${(m-rs)*PPM}px"><span>${mhm(m%1440)}</span></div>`;
  const evs = blocks.map(b=>evButton(b, (b.s-rs)*PPM+1, Math.max(20,(b.e-b.s)*PPM-2))).join("");
  const now = isToday && nowMin()>=rs && nowMin()<=re ? `<div class="now" style="top:${(nowMin()-rs)*PPM}px"></div>` : "";
  const tasks = visibleTasks();
  const dayTasks = tasks.filter(t=>t.due===day && !["done","cancelled"].includes(t.status)).sort((a,b)=>(a.dueTime||"99").localeCompare(b.dueTime||"99"));
  const missed = isToday ? tasks.filter(t=>taskMissed(t) && t.due<day) : [];
  const doneToday = tasks.filter(t=>["done","cancelled"].includes(t.status) && String(t.closedAt).slice(0,10)===day);
  const inbox = tasks.filter(t=>t.status==="inbox");
  const waiting = tasks.filter(t=>t.status==="waiting" && (!t.followUp || t.followUp<=day));
  const undated = tasks.filter(t=>!t.due && ["todo","doing"].includes(t.status));
  v.innerHTML = `<div id="zb">${isToday?zBannerHTML():""}</div>
    <div class="dayhead"><div class="big">${isToday?"Bugün":esc(longDate(day))}</div><span class="hint">${isToday?esc(longDate(day)):""}</span>
      <span class="sp"></span><button class="btn small" data-act="dayPrev">‹</button>${isToday?"":`<button class="btn small" data-act="dayToday">Bugün</button>`}<button class="btn small" data-act="dayNext">›</button>
      <button class="btn small" data-act="newEvent" data-day="${day}">+ Etkinlik</button><button class="btn small" data-act="newTask" data-day="${day}">+ Görev</button></div>
    ${allDay.length?`<div class="alldays">${allDay.map(e=>`<button class="chip" style="--c:${calColor(e.calKey)}" data-ev="${esc(e.id+"|"+e.calKey)}">${esc(e.title)}</button>`).join("")}</div>`:""}
    <div class="two"><div>${blocks.length?`<div class="tl" style="height:${H}px">${hrs}${evs}${now}</div>`:`<div class="empty">Bu gün için saatli etkinlik yok.</div>`}</div>
    <div>
      ${missed.length?`<div class="sec"><h3>Önceki günlerden kalanlar (${missed.length})</h3>${missed.map(taskHTML).join("")}</div>`:""}
      <div class="sec"><h3>${isToday?"Bugünün görevleri":"Bu günün görevleri"} (${dayTasks.length})</h3>${dayTasks.map(taskHTML).join("") || `<div class="hint">Görev yok.</div>`}</div>
      ${isToday && waiting.length?`<div class="sec"><h3>Bekleyenler ve takip (${waiting.length})</h3>${waiting.map(taskHTML).join("")}</div>`:""}
      ${isToday && inbox.length?`<div class="sec"><h3>Gelen kutusu (${inbox.length})</h3>${inbox.map(taskHTML).join("")}</div>`:""}
      ${isToday && undated.length?`<div class="sec"><h3>Tarihsiz görevler (${undated.length})</h3>${undated.slice(0,12).map(taskHTML).join("")}</div>`:""}
      ${doneToday.length?`<div class="sec"><h3>Bu gün kapananlar (${doneToday.length})</h3>${doneToday.map(taskHTML).join("")}</div>`:""}
    </div></div>`;
}

/* ============================ HAFTA ============================ */
function renderWeek(v){
  const start = weekStart(S.day), days = Array.from({length:7},(_,i)=>addDays(start,i));
  const perDay = days.map(d=>layoutLanes(timedBlocks(d)));
  const all = perDay.flat(); const rs = Math.floor(Math.min(8*60, ...all.map(b=>b.s))/60)*60, re = Math.min(1440, Math.ceil(Math.max(20*60, ...all.map(b=>b.e))/60)*60);
  const PPM = 0.8, H = (re-rs)*PPM;
  let gut = ""; for(let m=rs;m<=re;m+=60) gut += `<span style="top:${(m-rs)*PPM}px">${pad(Math.floor(m/60)%24)}</span>`;
  let lines = ""; for(let m=rs;m<=re;m+=60) lines += `<div class="wk-line" style="top:${(m-rs)*PPM}px"></div>`;
  const today = todayStr();
  v.innerHTML = `<div class="dayhead"><div class="big">${esc(longDate(start).split(" ").slice(0,2).join(" "))} – ${esc(longDate(days[6]).split(" ").slice(0,2).join(" "))}</div><span class="sp"></span>
      <button class="btn small" data-act="weekPrev">‹</button><button class="btn small" data-act="weekNow">Bu hafta</button><button class="btn small" data-act="weekNext">›</button></div>
    <div class="week">
      <div class="wk-h"></div>${days.map(d=>{ const w=parseD(d).getDay(); return `<button class="wk-h ${w===6?"sat":w===0?"sun":""} ${d===today?"today":""}" data-goday="${d}">${GUNK[w]} ${parseD(d).getDate()}</button>`; }).join("")}
      <div class="wk-ad" style="border-right:1px solid var(--line)"></div>${days.map(d=>`<div class="wk-ad">${eventsOn(d).filter(e=>e.allDay).map(e=>`<button class="chip" style="--c:${calColor(e.calKey)};font-size:11px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" data-ev="${esc(e.id+"|"+e.calKey)}">${esc(e.title)}</button>`).join("")}</div>`).join("")}
      <div class="wk-gut" style="height:${H}px">${gut}</div>
      ${days.map((d,i)=>{ const w=parseD(d).getDay(); return `<div class="wk-col ${w===6?"sat":w===0?"sun":""} ${isHoliday(d)?"hol":""}" style="height:${H}px">${lines}${perDay[i].map(b=>evButton(b,(b.s-rs)*PPM+1,Math.max(16,(b.e-b.s)*PPM-2))).join("")}${d===today&&nowMin()>=rs&&nowMin()<=re?`<div class="now" style="top:${(nowMin()-rs)*PPM}px;left:0"></div>`:""}</div>`; }).join("")}
    </div>
    <div class="hint" style="margin-top:8px">Aynı saatteki etkinlikler yan yana bölünür. Güne dokununca o günün ayrıntısı açılır.</div>`;
}

function dayDetailHTML(d){

function presetRange(k){ const t=todayStr(), r=S.rep;
  if(k==="today"){ r.from=r.to=t; } else if(k==="yesterday"){ r.from=r.to=addDays(t,-1); }

async function runReport(fmt){
  const r=S.rep, books=BOOK_IDS.filter(b=>r.books[b]); if(!books.length) return toast("En az bir defter seç.");
  const args = {from:r.from, to:r.to, books, status:r.status, includeEvents:r.events, format:fmt};
  try{
    if(fmt==="csv"){
      const d = await call("report.data", args);
      const cell = v => { const s=String(v??"").replace(/[\r\n]+/g," "); return /[;"]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
      const SEC = {overdue:"Geciken", due:"Planlanan", upcoming:"Yaklaşan (14 gün)", waiting:"Bekleyen", done:"Tamamlanan", cancelled:"İptal", inbox:"Gelen kutusu", undated:"Tarihsiz"};

      download(`rapor-${r.from}_${r.to}.csv`, new Blob(["\uFEFF"+rows.map(x=>x.map(cell).join(";")).join("\r\n")],{type:"text/csv"}));
    } else {
      toast("Rapor hazırlanıyor…"); const f = await call("report.build", args);
      const bin = atob(f.base64), u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      download(f.name, new Blob([u8],{type:f.mime}));
      if(f.driveUrl) toast("Rapor hazır. İndirme başlamadıysa Drive'daki kopyayı aç.", {link:f.driveUrl, linkText:"Drive'da aç"});
    }
  }catch(e){ toast("Rapor alınamadı: "+errText(e), {err:true}); }
}
function download(name, blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

/* ============================ HIZLI YAZIM (yapay zekâsız) ============================
   Başlık @yer 18:00-20:00 yarın #iş #bölüm
   #iş #araştırma #kişisel  → defter (kısaltmalar: #is #ar #tez #ki)
   diğer #etiketler          → o defterin sözlüğündeki etiketler
   @yer                      → konum (bir sonraki saat, tarih ya da # işaretine kadar)
   18:00 ya da 18:00-20:00   → saatli etkinlik; saat yoksa görev; "tüm gün" → tüm gün kaydı
   bugün, yarın, cuma, 12 kasım, 12.11, 2026-11-12 → tarih; yoksa bugün
   her gün / her pazartesi / her hafta / her ay / her yıl → tekrar
   45dk, 2sa → süre; !görev → saat olsa da görev */
const QB = {"iş":"is","is":"is","work":"is","araştırma":"arastirma","arastirma":"arastirma","ar":"arastirma","tez":"arastirma","kişisel":"kisisel","kisisel":"kisisel","ki":"kisisel"};
const QGUN = {"pazar":0,"pazartesi":1,"salı":2,"sali":2,"çarşamba":3,"carsamba":3,"perşembe":4,"persembe":4,"cuma":5,"cumartesi":6};
const QAY = {"ocak":1,"şubat":2,"subat":2,"mart":3,"nisan":4,"mayıs":5,"mayis":5,"haziran":6,"temmuz":7,"ağustos":8,"agustos":8,"eylül":9,"eylul":9,"ekim":10,"kasım":11,"kasim":11,"aralık":12,"aralik":12};
function quickParseLine(line, ctxDay){
  let s = " " + line.trim() + " ", book = null; const tags = [], today = ctxDay || todayStr();
  s = s.replace(/\s#([^\s#@]+)/g, (m, w) => { const k = w.toLocaleLowerCase("tr"); if(QB[k] && !book){ book = QB[k]; } else tags.push(k); return " "; });
  if(!book) return null;
  let type = null, rrule = null, date = null, time = null, endTime = null, dur = null, location = "";
  s = s.replace(/\s!görev(?![\p{L}\p{N}])/iu, () => { type = "task"; return " "; });
  s = s.replace(/(?<![\p{L}\p{N}])tüm gün(?![\p{L}\p{N}])/iu, () => { type = type || "allday"; return " "; });
  s = s.replace(/(?<![\p{L}\p{N}])her\s+(gün|hafta|ay|yıl|pazartesi|salı|sali|çarşamba|carsamba|perşembe|persembe|cumartesi|cuma|pazar)(?![\p{L}\p{N}])/iu, (m, w) => { const k=w.toLocaleLowerCase("tr");
    if(k==="gün") rrule="RRULE:FREQ=DAILY"; else if(k==="hafta") rrule="RRULE:FREQ=WEEKLY"; else if(k==="ay") rrule="RRULE:FREQ=MONTHLY"; else if(k==="yıl") rrule="RRULE:FREQ=YEARLY";

  const known = Object.keys(o).every(k=>["FREQ","BYDAY","UNTIL","INTERVAL","WKST"].includes(k)) && (!o.INTERVAL||o.INTERVAL==="1") && (freq!=="monthly"&&freq!=="yearly" || !o.BYDAY);
  return {freq: known?freq:"custom", days:(o.BYDAY||"").split(",").filter(Boolean).map(d=>BYDAY.indexOf(d)).filter(n=>n>=0), until:o.UNTIL?`${o.UNTIL.slice(0,4)}-${o.UNTIL.slice(4,6)}-${o.UNTIL.slice(6,8)}`:"", raw:r}; }

  let r = "RRULE:FREQ="+({daily:"DAILY",weekly:"WEEKLY",monthly:"MONTHLY",yearly:"YEARLY"}[f.freq]);

function askScope(label, onPick){
  $("#e_scope").innerHTML = `<div class="banner" style="margin-top:12px"><b>Tekrarlı etkinlik.</b> ${label}
    <div class="scope"><button class="btn" data-scope="this">Yalnızca bu etkinlik</button><button class="btn" data-scope="following">Bu ve sonraki etkinlikler</button><button class="btn" data-scope="all">Serinin tümü</button><button class="btn small" data-scope="">Vazgeç</button></div></div>`;
  $("#e_scope").onclick = ev=>{ const b=ev.target.closest("[data-scope]"); if(!b) return; $("#e_scope").innerHTML=""; if(b.dataset.scope) onPick(b.dataset.scope); };
}
async function saveEvent(scope){
  const e = S.editEvent, form = readEventForm();
  if(e.recurringEventId && !scope) return askScope("Değişikliği neye uygulayayım?", s=>saveEvent(s));
  const btn = $("[data-act=evSave]"); busyBtn(btn, true);
  const ecid = e.id ? null : newOid(); if(ecid) form.clientId = ecid;       // yeni etkinlikte istemci kimliği: yeniden gönderim çift etkinlik oluşturmaz
  if(isOffline() || isTmp(e.id)){
    busyBtn(btn, false);
    if(e.id){ toast(isTmp(e.id) ? "Bu etkinlik henüz eşitlenmedi; bağlanınca düzenleyebilirsin." : "Etkinlik düzenleme bağlantı gerektirir."); return; }
    offlineSaveEvent(form, ecid); $("#dlg").close(); render(); return; }
  try{ const r = await call("event.save", {event:form, scope:scope||"single", etag:e.etag}); $("#dlg").close();
    toast("Kaydedildi", r.undo?{undo:r.undo}:{});
    const simple = !e.recurringEventId && !(form.recurrence && form.recurrence.length) && !(e.recurrence && e.recurrence.length);
    if(simple){ upsertEvent(r.event, e.id ? e.id+"|"+e.calKey : null); render(); }
    else { invalidateEvents(); render(); await ensureRange(true); render(); } }
  catch(err){
    busyBtn(btn, false);
    if(isNetErr(err) && !e.id){ setOfflineFlag(); offlineSaveEvent(form, ecid); $("#dlg").close(); render(); return; }
    handleConflict(err); }
}
async function deleteEvent(scope){
  const e=S.editEvent;
  if(isOffline() || isTmp(e.id)){ toast("Etkinlik silme bağlantı gerektirir."); return; }
  if(e.recurringEventId && !scope) return askScope("Neyi sileyim?", s=>deleteEvent(s));
  if(!e.recurringEventId && !scope){ $("#e_scope").innerHTML = `<div class="banner ek" style="margin-top:12px"><b>Etkinlik silinsin mi?</b><div class="row" style="margin-top:8px"><button class="btn warn" data-del="yes">Evet, sil</button><button class="btn small" data-del="">Vazgeç</button></div></div>`;
    $("#e_scope").onclick = ev=>{ const b=ev.target.closest("[data-del]"); if(!b) return; $("#e_scope").innerHTML=""; if(b.dataset.del) deleteEvent("single"); }; return; }
  try{ const r = await call("event.delete", {calKey:e.calKey, id:e.id, scope, etag:e.etag}); $("#dlg").close(); toast("Silindi", r.undo?{undo:r.undo}:{});
    delete S.events[e.id+"|"+e.calKey]; render();
    if(e.recurringEventId && scope!=="this"){ invalidateEvents(); await ensureRange(true); render(); } }
  catch(err){ handleConflict(err); }
}
async function handleConflict(err){
  toast(errText(err), {err:true});
  if(err.code==="conflict"){ $("#dlg").close(); invalidateEvents(); await refreshTasks(); await ensureRange(true); render(); }
}

function tagBoxHTML(book, selected){
  const dict = tagChoices(book);
  return `<div class="hint" style="margin-bottom:4px">Etiketler · ${esc(BOOKS[book])} defteri</div>
    <div class="row">${dict.map(g=>`<label class="row" style="gap:4px"><input type="checkbox" data-tg="${esc(g)}" ${selected.includes(g)?"checked":""}>#${esc(g)}</label>`).join("") || `<span class="hint">Bu defterin etiket sözlüğü boş.</span>`}</div>

/* ---------- not içindeki liste: "- [ ] madde" satırları ---------- */
const LI_RE = /^\s*(?:[-•*]|\d+[.)])\s*(?:\[( |x|X)\]\s*)?(.+)$/;
function parseChecklist(notes){ return String(notes||"").split("\n").map((l,i)=>{ const m=l.match(LI_RE); return m ? {line:i, done:(m[1]||"").toLowerCase()==="x", text:m[2].trim(), boxed:m[1]!==undefined} : null; }).filter(Boolean); }
function toggleChecklistLine(notes, lineNo){ const L=String(notes||"").split("\n"); const m=L[lineNo] && L[lineNo].match(LI_RE); if(!m) return notes;
  L[lineNo] = "- [" + ((m[1]||"").toLowerCase()==="x" ? " " : "x") + "] " + m[2].trim(); return L.join("\n"); }
function checklistHTML(notes, owner){ const items = parseChecklist(notes); if(!items.length) return "";
  return `<div class="cl">${items.map(it=>`<label class="cli ${it.done?"done":""}"><input type="checkbox" data-cl="${it.line}" data-owner="${owner}" ${it.done?"checked":""}><span>${esc(it.text)}</span></label>`).join("")}</div>`; }
function mailLinkHTML(n){ const m=String(n||"").match(/https:\/\/mail\.google\.com\/[^\s]+/); return m?`<div style="margin-top:8px"><a class="btn small" href="${esc(m[0])}" target="_blank" rel="noopener">✉ E-postayı aç</a></div>`:""; }
function notesWithoutList(notes){ return String(notes||"").split("\n").filter(l=>!LI_RE.test(l)).join("\n").trim(); }

async function saveTaskForm(){
  const t=S.editTask, book=$("#t_book").value;
  const data = { id:t.id, book: t.id ? t.book : book, title:$("#t_title").value.trim()||"(başlıksız)", status:$("#t_status").value, due:$("#t_due").value, dueTime:$("#t_time").value, estimate:+$("#t_est").value||30,
    followUp:$("#t_fu").value, waitingOn:$("#t_wait").value.trim(), recipient:$("#t_rec").value.trim(), notes:$("#t_notes").value, tags:$$("[data-tg]:checked").map(x=>x.dataset.tg), dependsOn:$$("[data-dep]").length ? $$("[data-dep]:checked").map(x=>x.dataset.dep) : (t.dependsOn||[]) };
  const btn = $("[data-act=taskSave]"); busyBtn(btn, true);
  const wantCal = !!$("#t_cal") && $("#t_cal").checked, cid = t.id ? null : newOid();
  if(cid) data.id = cid;      // yeni görevlerde kimliği istemci üretir: bağlantı koparsa yeniden gönderim aynı görevi ikinci kez oluşturmaz
  if(isOffline()){
    if(t.id && book!==t.book){ busyBtn(btn, false); toast("Defter değiştirme bağlantı gerektirir."); return; }
    offlineSaveTask(t, data, wantCal, cid); busyBtn(btn, false); $("#dlg").close(); render(); return;
  }
  try{
    if(t.id && book!==t.book){ // defter değiştirme: yeni defterde kopya, eskisini sil (geçmişte iz kalır)
      const copy = Object.assign({}, t, data, {id:undefined, book, tags:[], dependsOn:[], source:"taşındı: "+BOOKS[t.book]});
      const c = await call("task.save", {task:copy}); await call("task.delete", {id:t.id, version:t.version}); S.tasks = S.tasks.filter(x=>x.id!==t.id); upsertTask(c.task); toast(`${BOOKS[book]} defterine taşındı`);
    } else {
      const r = await call("task.save", {task:data, version:t.id?t.version:undefined}); upsertTask(r.task);
      const want = $("#t_cal").checked, has = !!r.task.eventId;
      if(want && !data.due){ toast("Takvimde göstermek için tarih gir; görev kaydedildi.", {err:true}); }
      else if(want !== has){ const c = await call("task.calendar", {id:r.task.id, on:want}); upsertTask(c.task);
        if(c.event) upsertEvent(c.event); if(c.removedEventId) delete S.events[c.removedEventId+"|"+r.task.book]; }
      else if(has){ invalidateEvents(); ensureRange(true); }
      toast(want && data.due ? "Kaydedildi · telefon takviminde de görünecek" : "Kaydedildi", r.undo?{undo:r.undo}:{});
    }
    $("#dlg").close(); render();
  }catch(e){
    busyBtn(btn, false);
    if(isNetErr(e) && !(t.id && book!==t.book)){ setOfflineFlag(); offlineSaveTask(t, data, wantCal, cid); $("#dlg").close(); render(); return; }
    handleConflict(e); }
}
async function taskStatus(id, status){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  const closing = ["done","cancelled"].includes(status), nowIso = new Date().toISOString();
  if(isTmp(id)){ patchQueuedTask(id, {status}); Object.assign(t, {status, closedAt: closing ? nowIso : ""}); render(); return; }   // henüz eşitlenmemiş görev: kuyruktaki kaydı güncelle
  const before = Object.assign({}, t);
  Object.assign(t, {status, closedAt: closing ? nowIso : ""}); render();   // ekran hemen tepki verir
  if(isOffline()){ enqueue("status", {id, status, version:before.version}); t._pending = 1; render(); toast("Çevrimdışı: durum değişikliği kuyruğa alındı (⏳)."); return; }
  try{ const r = await call("task.status", {id, status, version:before.version}); Object.assign(t, r.task); render(); toast(`“${t.title.slice(0,50)}” → ${STATUS[status]}`, {undo:r.undo}); }
  catch(e){
    if(isNetErr(e)){ setOfflineFlag(); enqueue("status", {id, status, version:before.version}); t._pending = 1; render(); toast("Bağlantı yok: değişiklik kuyruğa alındı (⏳)."); return; }
    Object.assign(t, before); render(); handleConflict(e); }
}

async function saveSettingsForm(){
  const s = JSON.parse(JSON.stringify(S.boot.settings));
  $$("[data-bs]").forEach(el=>{ const b=el.dataset.bs, k=el.dataset.k; s.books[b]=s.books[b]||{};
