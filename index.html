    else if(k==="ai") s.books[b].ai = el.checked;
    else s.books[b][k] = el.value; });
  const digestBefore = ((S.boot.settings.research||{}).digest) || "weekly", digestNow = $("#s_dig") ? $("#s_dig").value : digestBefore;
  if($("#s_kw")) s.research = Object.assign({}, s.research, {keywords: $("#s_kw").value.split(/[,\n]+/).map(x=>x.trim().toLocaleLowerCase("tr")).filter(Boolean), trusted: $("#s_trust").value.split(/[,\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean), blocked: $("#s_block").value.split(/[,\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean), digest: digestNow});
  s.rules = $("#s_rules").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.match(/^(.+?)\s*=>\s*(is|arastirma|kisisel)(?:\s+#(\S+))?$/); return m?{match:m[1].trim(), book:m[2], tag:m[3]||null}:null; }).filter(Boolean);
  s.ai = Object.assign({}, s.ai, {provider:$("#s_prov").value, singleCall:$("#s_single").checked}); if($("#s_prov").value==="gemini") s.ai.geminiModel=$("#s_model").value.trim(); else s.ai.anthropicModel=$("#s_model").value.trim();
  const btn = $("[data-act=saveSettings]"); busyBtn(btn, true);
  try{ await call("settings.save", {settings:s}); if(digestNow !== digestBefore) await call("digest.schedule", {freq:digestNow}); await refreshAll(); $("#dlg").close(); toast("Ayarlar kaydedildi"); render(); }catch(e){ busyBtn(btn, false); toast(errText(e), {err:true}); }
}

/* ============================ bildirim ============================ */
function toast(msg, o={}){
  const el=document.createElement("div"); el.className="toast"+(o.err?" err":"");
  el.innerHTML=`<span>${esc(msg)}</span>${o.undo||o.onUndo?`<button>Geri al</button>`:""}${o.link?`<a href="${esc(o.link)}" target="_blank" rel="noopener" style="color:inherit;margin-left:auto;font-weight:700">${esc(o.linkText||"Aç")}</a>`:""}`;
  if(o.onUndo) el.querySelector("button").onclick = ()=>{ el.remove(); o.onUndo(); };
  else if(o.undo) el.querySelector("button").onclick = async ()=>{ el.remove(); try{ await call("undo", {token:o.undo}); toast("Geri alındı"); invalidateEvents(); await refreshTasks(); await ensureRange(true); render(); }catch(e){ toast(errText(e), {err:true}); } };
  $("#toasts").appendChild(el); setTimeout(()=>el.remove(), o.undo||o.onUndo||o.link?12000:(o.err?7000:3500));
}

/* ============================ tıklamalar ============================ */
document.addEventListener("click", async e=>{
  const evb = e.target.closest("[data-ev]"); if(evb){ e.preventDefault(); return openEvent(evb.dataset.ev); }
  const gd = e.target.closest("[data-goday]"); if(gd){ S.day=gd.dataset.goday; S.view="today"; renderTabs(); await ensureRange(); return render(); }
  const sd = e.target.closest("[data-selday]"); if(sd){ S.selDay = S.selDay===sd.dataset.selday ? null : sd.dataset.selday; render(); setTimeout(()=>$("#dayCap")?.focus(), 30); return; }
  const rp = e.target.closest("[data-rp]"); if(rp){ presetRange(rp.dataset.rp); return render(); }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const tEl = el.closest("[data-task]"), tid = tEl && tEl.dataset.task;
  switch(el.dataset.act){
    case "done": taskStatus(tid, el.checked ? "done" : "todo"); break;
    case "cancel": taskStatus(tid, "cancelled"); break;
    case "reopen": taskStatus(tid, "todo"); break;
    case "editTask": openTask(tid); break;
    case "newTask": openTask(null, el.dataset.day); break;
    case "newEvent": openEvent(null, el.dataset.day); break;
    case "taskSave": saveTaskForm(); break;
    case "liAdd": { const v=($("#t_li").value||"").trim(); if(!v) break; const ta=$("#t_notes"); ta.value = (ta.value.replace(/\s+$/,"") + (ta.value.trim()?"\n":"") + "- [ ] " + v); $("#t_li").value=""; $("#t_li").focus(); $("#t_cl").innerHTML = checklistHTML(ta.value,"dlg"); } break;
    case "liSplit": { const ta=$("#t_notes"); const rest = notesWithoutList(ta.value); if(!rest.includes(",")) { toast("Virgülle ayrılmış bir metin bulunamadı."); break; }
      const items = rest.split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean); const keepList = ta.value.split("\n").filter(l=>LI_RE.test(l));
      ta.value = keepList.concat(items.map(x=>"- [ ] "+x)).join("\n"); $("#t_cl").innerHTML = checklistHTML(ta.value,"dlg"); } break;
    case "addTag": { const book = $("#t_book").value, name = ($("#t_newtag").value||"").trim().toLocaleLowerCase("tr").replace(/^#/,"").replace(/\s+/g,"-");
      if(!name) { toast("Önce etiketin adını yaz."); break; }
      const keep = $$("[data-tg]:checked").map(x=>x.dataset.tg);
      if(!tagChoices(book).includes(name)){ busyBtn(el, true, "Ekleniyor…");
        try{ const s = JSON.parse(JSON.stringify(S.boot.settings)); s.books[book] = s.books[book] || {}; s.books[book].tags = (s.books[book].tags||[]).concat([{name, desc:""}]);
          await call("settings.save", {settings:{books:s.books}}); S.boot.settings.books = s.books; }
        catch(err){ busyBtn(el,false); toast(errText(err),{err:true}); break; } }
      $("#t_tagbox").innerHTML = tagBoxHTML(book, keep.concat([name])); toast(`#${name} etiketi eklendi`); } break;
    case "taskCancelDlg": { const id=$("#dlg").dataset.task; $("#dlg").close(); taskStatus(id, "cancelled"); } break;
    case "taskDelete": $("#t_confirm").innerHTML = `<div class="banner ek" style="margin-top:12px"><b>Görev silinsin mi?</b> İçeriğiyle birlikte saklanır; Geçmiş sekmesindeki “Silinen görevler” bölümünden her zaman geri getirebilirsin.<div class="row" style="margin-top:8px"><button class="btn warn" data-act="taskDeleteYes">Evet, sil</button><button class="btn small" data-act="taskDeleteNo">Vazgeç</button></div></div>`; break;
    case "taskDeleteNo": $("#t_confirm").innerHTML=""; break;
    case "taskDeleteYes": { const t=S.editTask;
      if(isTmp(t.id)){ removeQueuedTmp(t.id); $("#dlg").close(); render(); toast("Bekleyen kayıt silindi."); break; }
      if(isOffline()){ toast("Silme bağlantı gerektirir."); break; }
      busyBtn(el, true, "Siliniyor…"); try{ const r=await call("task.delete",{id:t.id, version:t.version}); $("#dlg").close(); S.tasks=S.tasks.filter(x=>x.id!==t.id); render(); toast("Silindi",{undo:r.undo}); }catch(err){ busyBtn(el,false); handleConflict(err); } } break;
    case "evSave": saveEvent(); break;
    case "evDelete": deleteEvent(); break;
    case "dlgClose": $("#dlg").close(); break;
    case "dayPrev": S.day=addDays(S.day,-1); await ensureRange(); render(); break;
    case "dayNext": S.day=addDays(S.day,1); await ensureRange(); render(); break;
    case "dayToday": S.day=todayStr(); await ensureRange(); render(); break;
    case "weekPrev": S.day=addDays(S.day,-7); await ensureRange(); render(); break;
    case "weekNext": S.day=addDays(S.day,7); await ensureRange(); render(); break;
    case "weekNow": S.day=todayStr(); await ensureRange(); render(); break;
    case "monPrev": case "monNext": case "monNow": { const [y,m]=S.month.split("-").map(Number); const d = el.dataset.act==="monNow" ? new Date() : new Date(y, m-1+(el.dataset.act==="monNext"?1:-1), 1); goMonth(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); } break;
    case "dayParse": parse($("#dayCap").value, el.dataset.day); break;
    case "capClose": S.cap=null; renderPreview(); $("#preview").classList.add("hidden"); break;
    case "capCommit": commitCapture(); break;
    case "pwaSave": { const url=($("#pw_url").value||"").trim(), token=($("#pw_key").value||"").trim() || (lsGet("kd3-pwa")||{}).token || "";
      if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(url)){ toast("Adres https://script.google.com/macros/s/…/exec biçiminde olmalı.",{err:true}); break; }
      if(!/^kd_[0-9a-f]{60,}$/.test(token)){ toast("Erişim anahtarı kd_ ile başlayan uzun bir metin olmalı; baştan sona kopyaladığından emin ol.",{err:true}); break; }
      lsSet("kd3-pwa",{url,token}); location.reload(); } break;
    case "reparse": { const t = S.tasks.find(x=>x.id===tid); if(t && !isTmp(t.id)) parse((t.notes || t.title).trim(), null, t.book, t.id); } break;
    case "obDel": { const oid = el.dataset.oid; obSave(obLoad().filter(x=>x.oid!==oid)); S.tasks = S.tasks.filter(x=>!x.id.startsWith("tmp_"+oid)); Object.keys(S.events).forEach(k=>{ if(k.startsWith("tmp_"+oid)) delete S.events[k]; }); showOutbox(); render(); toast("Bekleyen kayıt silindi. Başka kayıtlara bağlıysa görünüm bir sonraki eşitlemede düzelir."); } break;
    case "obFlush": { $("#dlg").close(); if(isOffline()){ toast("Hâlâ çevrimdışısın; bağlanınca kendiliğinden eşitlenir."); } else flushOutbox(); } break;
    case "callTask": { const id = el.closest("[data-call]").dataset.call; busyBtn(el, true, "Ekleniyor…"); try{ const r = await call("call.task", {id}); upsertTask(r.task); toast("Araştırma defterine görev eklendi: " + r.task.title); renderCalls($("#view")); }catch(err){ busyBtn(el,false); toast(errText(err),{err:true}); } } break;
    case "callTrust": { const id = el.closest("[data-call]").dataset.call, trust = el.dataset.trust;
      if(trust==="güvenli" && !el.dataset.sure){ el.dataset.sure="1"; el.textContent="Emin misin? Tekrar bas"; break; }
      try{ await call("call.trust", {id, trust}); invalidateSettings(); toast(trust==="güvenli" ? "Gönderici güvenli listeye eklendi" : "Gönderici engellendi, çağrı gizlendi"); renderCalls($("#view")); }catch(err){ toast(errText(err),{err:true}); } } break;
    case "callWatch": { const id = el.closest("[data-call]").dataset.call, c = (S.calls||[]).find(x=>x.id===id); try{ await call("call.set", {id, status: c && c.status==="takipte" ? "yeni" : "takipte"}); renderCalls($("#view")); }catch(err){ toast(errText(err),{err:true}); } } break;
    case "callHide": { const id = el.closest("[data-call]").dataset.call, c = (S.calls||[]).find(x=>x.id===id); try{ await call("call.set", {id, status:"gizli"}); renderCalls($("#view")); toast("Çağrı gizlendi", {onUndo: async ()=>{ try{ await call("call.set", {id, status: (c && c.status) || "yeni"}); renderCalls($("#view")); }catch(e){} }}); }catch(err){ toast(errText(err),{err:true}); } } break;
    case "digestSend": { busyBtn(el, true, "Gönderiliyor…"); try{ const r = await call("digest.send"); toast(r.sent ? `Özet e-postana gönderildi (${r.fresh} yeni, ${r.upcoming} yaklaşan son tarih)` : "Gönderilecek yeni çağrı ya da yaklaşan son tarih yok"); }catch(err){ toast(errText(err),{err:true}); } busyBtn(el,false); } break;
    case "mailScan": { busyBtn(el, true, "Taranıyor…"); try{ const r = await call("mail.scan"); await refreshTasks(); toast(r.skipped ? "Tarama atlandı: "+r.skipped : `${r.read} mail okundu, ${r.proposals} öneri Gelen kutusuna eklendi.`); render(); openSettings(); }catch(err){ busyBtn(el,false); toast(errText(err),{err:true}); } } break;
    case "pwaReset": try{ localStorage.removeItem("kd3-pwa"); }catch(e){} location.reload(); break;
    case "quickHelp": $("#dlgBody").innerHTML = `<div class="dlg"><h2>Hızlı yazım</h2><div class="hint" style="color:var(--ink);font-size:14px;line-height:1.7">
      Satırda bir defter etiketi olduğunda metin yapay zekâya gönderilmeden, anında işlenir:<br>
      <b>#iş</b>, <b>#araştırma</b> (#tez, #ar), <b>#kişisel</b> (#ki) → defter<br>
      diğer <b>#etiket</b>ler → o defterin sözlüğündeki etiketler<br>
      <b>@yer</b> → konum (saatten ya da #'dan önce biter)<br>
      <b>18:00</b> ya da <b>18:00-20:00</b> → saatli etkinlik · saat yoksa görev · <b>tüm gün</b> → tüm gün kaydı · <b>!görev</b> → saat olsa da görev<br>
      <b>bugün</b>, <b>yarın</b>, <b>cuma</b>, <b>12 kasım</b>, <b>12.11</b> → tarih (yazılmazsa bugün)<br>
      <b>her gün</b>, <b>her pazartesi</b>, <b>her hafta</b>, <b>her ay</b>, <b>her yıl</b> → tekrar<br>
      <b>45dk</b>, <b>2sa</b> → süre<br><br>
      Örnekler:<br><code>Toplantı @Konferans Salonu 18:00 #iş #bölüm</code><br><code>Diş kontrolü 10 ekim 11:30 #kişisel #health</code><br><code>Ders notlarını hazırla yarın #iş #ders</code><br><code>Bölüm 2 okuma her pazartesi 09:00-11:00 #araştırma #literatür</code><br><br>
      Birden çok satır yazabilirsin; her satırda defter etiketi varsa hepsi anında işlenir. Defter etiketi olmayan metinler her zamanki gibi yapay zekâya gider.</div></div>
      <div class="foot"><span></span><button class="btn" data-act="dlgClose">Kapat</button></div>`; $("#dlg").showModal(); break;
    case "rep": runReport(el.dataset.fmt); break;
    case "repPreview": previewReport(); break;
    case "undelete": { busyBtn(el, true, "Getiriliyor…"); try{ const r = await call("task.undelete", {id:el.dataset.id}); upsertTask(r.task); toast("Görev geri getirildi: " + r.task.title); render(); }catch(err){ busyBtn(el,false); toast(errText(err),{err:true}); } } break;
    case "histRestore": { const row = S.histRows[+el.dataset.i]; busyBtn(el, true, "Geri yükleniyor…");
      try{ const r = await call("history.restore", {t:row.t, refId:row.refId, type:row.type, side:el.dataset.side}); if(r.task) upsertTask(r.task); else { invalidateEvents(); ensureRange(true); }
        toast("Geri yüklendi" + (r.task ? ": " + r.task.title : "")); render(); }catch(err){ busyBtn(el,false); toast(errText(err),{err:true}); } } break;
    case "repairDup": { busyBtn(el, true, "Onarılıyor…"); try{ const r = await call("repair.duplicates"); toast(r.fixed.length ? `${r.fixed.length} kopya satıra yeni kimlik verildi; artık silebilir ya da düzenleyebilirsin.` : "Kopya satır yok."); await refreshTasks(); openSettings(); }catch(err){ busyBtn(el,false); toast(errText(err),{err:true}); } } break;
    case "histGo": S.hist={from:$("#hf").value, to:$("#ht").value, book:$("#hb").value, q:$("#hq").value}; render(); break;
    case "zSend": { el.disabled=true; try{ await call("z.send",{mode:el.dataset.mode}); toast("Ara rapor e-postana gönderildi (bugünün şimdiye kadarki hali)"); await refreshTasks(); renderBannerOnly(); }catch(err){ toast(errText(err),{err:true}); el.disabled=false; } } break;
    case "saveKey": { const k=$("#s_key").value.trim(); if(!k) return toast("Önce anahtarı yapıştır."); try{ await call("secret.save",{provider:$("#s_prov").value, key:k}); $("#s_key").value=""; S.boot.ai.hasKey=true; toast("Anahtar kaydedildi"); }catch(err){ toast(errText(err),{err:true}); } } break;
    case "testAi": { $("#aiOut").textContent="Test ediliyor…"; try{ await call("settings.save",{settings:Object.assign({}, S.boot.settings, {ai:Object.assign({}, S.boot.settings.ai, {provider:$("#s_prov").value})})}); const r=await call("ai.test"); $("#aiOut").textContent = r.ok ? ("Çalışıyor ✓ · model: " + r.model + (r.autoFixed ? ` (“${r.from}” geçersizdi; otomatik düzeltildi)` : "")) : "Beklenmeyen yanıt"; if(r.autoFixed){ $("#s_model").value = r.model; await refreshTasks(); } }catch(err){ $("#aiOut").textContent = errText(err); } } break;
    case "saveSettings": saveSettingsForm(); break;
    case "backupNow": try{ await call("backup.now"); toast("Yedek Drive'a kaydedildi"); }catch(err){ toast(errText(err),{err:true}); } break;
  }
});
async function goMonth(mk){ S.month = mk; S.selDay = null; const [f,t] = viewRange(); render(); if(!coveredBy(f,t)) { $("#view").querySelectorAll(".mc").forEach(c=>c.style.opacity=.45); } await ensureRange(); render(); }
document.addEventListener("change", async e=>{ const el=e.target;
  if(el.dataset.cl!==undefined){ const line=+el.dataset.cl;
    if(el.dataset.owner==="dlg"){ const ta=$("#t_notes"); ta.value = toggleChecklistLine(ta.value, line); $("#t_cl").innerHTML = checklistHTML(ta.value,"dlg"); return; }
    const t = S.tasks.find(x=>x.id===el.dataset.owner); if(!t) return; const before = t.notes; t.notes = toggleChecklistLine(t.notes, line); render();   // listede işaretleme hemen görünür
    if(isOffline() || isTmp(t.id)){ offlineEdit(t, {notes:t.notes}); render(); return; }
    try{ const r = await call("task.save", {task:{id:t.id, book:t.book, notes:t.notes}, version:t.version}); upsertTask(r.task); render(); }
    catch(err){ if(isNetErr(err)){ setOfflineFlag(); offlineEdit(t, {notes:t.notes}); render(); return; } t.notes = before; render(); handleConflict(err); }
    return; }
  if(el.id==="jumpM"||el.id==="jumpY"){ goMonth(`${$("#jumpY").value}-${pad(+$("#jumpM").value)}`); }
  if(el.id==="tq"||el.id==="tb"||el.id==="tt"){ S.taskFilter={q:$("#tq").value, book:$("#tb").value, tag:$("#tt").value}; render(); }
  if(el.id==="rf") S.rep.from=el.value; if(el.id==="rt") S.rep.to=el.value; if(el.dataset.rb) S.rep.books[el.dataset.rb]=el.checked; if(el.name==="rs") S.rep.status=el.value; if(el.id==="re") S.rep.events=el.checked; });
document.addEventListener("keydown", e=>{ if(e.target.id==="dayCap" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); parse(e.target.value, S.selDay); } });
$("#btnSettings").addEventListener("click", openSettings);
$("#sync").addEventListener("click", ()=>{ if(obLoad().length || isOffline()) showOutbox(); });
boot();
</script>
